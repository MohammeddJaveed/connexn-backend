services:
  
  postgres:
     image: postgres:17-alpine
     container_name: "postgres"
     environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
     healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s