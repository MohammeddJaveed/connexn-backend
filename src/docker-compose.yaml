services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    
  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 250ms

  pgview:
    image: catwallon/pgview
    ports:
      - "8080:8080"
    environment:
      PGVIEW_URL: ${DATABASE_URL}


  posts:
    build:
      context: .
      dockerfile: posts/dockerfile
    image: connexn-post:latest
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy     
  notification:
    build:
      context: ./notification
      dockerfile: dockerfile
    environment:
      NODE_ENV: production
      PORT: 3005
    ports:
      - "3005:3005"

  identity:
    build:
      context: .
      dockerfile: identity/Dockerfile
    image: connexn-identity:latest
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/dockerfile
    image: api-gateway:latest
    environment:
     NODE_ENV: production
     PORT: 3003
     JWT_SECRET: ${JWT_SECRET}
     IDENTITY_SERVICE_URL: http://identity:3001
    ports:
     - "3003:3003"
    depends_on:
      identity:
        condition: service_started
