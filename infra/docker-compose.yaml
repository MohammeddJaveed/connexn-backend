services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    
  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 250ms

  pgview:
    image: catwallon/pgview
    ports:
      - "8080:8080"
    environment:
      PGVIEW_URL: ${DATABASE_URL}


  posts:
    build:
      context: ..
      dockerfile: apps/posts/dockerfile
    image: connexn-post:latest
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy     
  notification:
    build:
      context: ../apps/notification
      dockerfile: dockerfile
    environment:
      NODE_ENV: production
      PORT: 3005
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_ENDPOINT: ${SES_ENDPOINT}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
    ports:
      - "3005:3005"
    depends_on:
      floci:
        condition: service_started

  identity:
    build:
      context: ..
      dockerfile: apps/identity/Dockerfile
    image: connexn-identity:latest
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/dockerfile
    image: api-gateway:latest
    environment:
     NODE_ENV: production
     PORT: 3003
     JWT_SECRET: ${JWT_SECRET}
     IDENTITY_SERVICE_URL: http://identity:3001
    ports:
     - "3003:3003"
    depends_on:
      identity:
        condition: service_started


  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for Lambda, ECS, RDS
      - ./data:/app/data                         # Persistent storage   
